spring.application.name=MediFlow
# Plataformas como Railway indican el puerto en PORT; en local y en Docker queda el 8080.
server.port=${PORT:8080}

# =========================
# MySQL
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Reconecta solo después de que el equipo se suspende (conexiones cerradas por MySQL).
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=600000

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =========================
# Servicio de IA (FastAPI)
# =========================
python.url=${PYTHON_URL:http://localhost:8000}
python.connect-timeout=5s
# Gemini puede tardar 2-3 minutos con redes lentas o documentos largos.
python.read-timeout=300s

# =========================
# Subida de archivos
# =========================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# =========================
# Administrador inicial (opcional): se crea al arrancar si no existe
# =========================
mediflow.admin.usuario=${MEDIFLOW_ADMIN_USER:}
mediflow.admin.password=${MEDIFLOW_ADMIN_PASSWORD:}

# =========================
# OpenAPI / Swagger
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=MediFlow
info.app.description=Agente de triaje, extraccion y enrutamiento de documentos clinicos
info.app.version=2.0.0
management.info.env.enabled=true
