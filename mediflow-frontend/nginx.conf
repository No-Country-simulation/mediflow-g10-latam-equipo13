server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos clínicos de hasta 25 MB.
    client_max_body_size 26m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API principal (Spring Boot). El análisis con IA puede tardar: timeouts amplios.
    location /spring/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    # Motor de IA (FastAPI), para el modo Directo.
    location /fastapi/ {
        proxy_pass http://fastapi:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    # Recursos con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier otra ruta devuelve index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
